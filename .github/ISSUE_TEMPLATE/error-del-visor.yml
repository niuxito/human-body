name: Error del visor / Viewer bug
description: Algo no funciona en la aplicación
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué ocurre / What happens
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo / Steps to reproduce
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador y dispositivo / Browser and device
      placeholder: "Firefox 130, Linux; Safari, iPhone 14…"
    validations:
      required: true
  - type: textarea
    id: consola
    attributes:
      label: Errores de la consola / Console errors
      render: shell
